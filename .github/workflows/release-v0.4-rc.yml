name: Publish V0.4 RC Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-v0.4-rc]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npm run tauri build -- --bundles msi,nsis
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.0-rc.6"
          $notes = "FileOrbit V0.4 RC6. RC6 checkpoint: includes the RC5 Windows-validated path plus strict journal corruption handling, Move/Undo audit compensation, deterministic History/Undo state, atomic History snapshot, committed npm/Cargo lockfiles, pinned Rust 1.98.1 and Action SHAs, and serialized in-process journal mutation. Folder Doctor remains read-only; real Move still requires explicit review and validation. Use disposable test files first."
          gh release create $tag src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*-setup.exe --target "${{ github.sha }}" --title "FileOrbit V0.4 RC6" --notes $notes --prerelease
