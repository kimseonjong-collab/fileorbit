name: Commit generated lockfiles
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  lock:
    if: contains(github.event.head_commit.message, '[commit-lockfiles]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --exit-code && exit 1 || true
          git commit -m "build: commit generated dependency lockfiles"
          git push
