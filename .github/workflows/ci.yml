name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - name: Guard exact direct dependency versions
        run: |
          node -e "const p=require('./package.json'); for(const [n,v] of Object.entries({...p.dependencies,...p.devDependencies})) if(/[~^*xX><=| ]/.test(v)) throw new Error(n + ' is not exactly pinned: ' + v)"
      - name: Guard reproducible workflow dependencies
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['.github/workflows/ci.yml','.github/workflows/web-preview.yml','.github/workflows/release-v0.4-rc.yml']){
            const s=fs.readFileSync(p,'utf8');
            if(/uses:\s+[^\s]+@(v\d+|stable)\b/.test(s)) throw new Error(p+' contains floating Action ref');
            if(/npm install --no-audit --no-fund/.test(s)) throw new Error(p+' regressed from npm ci');
          }
          NODE
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
      - name: Guard Windows GUI subsystem
        run: grep -F 'windows_subsystem = "windows"' src-tauri/src/main.rs
      - name: Guard release version alignment
        run: node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json'); if(p.version!==t.version) throw new Error('package.json and tauri.conf.json versions differ')"
      - name: Guard approved Folder Map routing
        run: |
          grep -F 'mapTarget?.sources.length===1?mapTarget.sources[0]' src/App.tsx
          grep -F 'const approvedFolder=' src/App.tsx
          grep -F '승인된 ${role} 폴더가 여러 개라 목적지를 자동 결정하지 않음' src/App.tsx
      - name: Guard desktop asset base and Move gate order
        run: |
          grep -F 'base: process.env.FILEORBIT_WEB_PREVIEW === "1" ? "/fileorbit/" : "./"' vite.config.ts
          grep -F 'disabled={validation.length!==approvedDownloads.length||!approvedDownloads.length||validation.some(v=>!v.ok)}' src/App.tsx
          grep -F '?"승인 파일 이동 실행":"이동 계획 안전검증"' src/App.tsx
      - run: npm run build
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: rustc --version && cargo --version
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  windows-installer:
    needs: [frontend, rust-check]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-checkpoint]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npm run tauri build -- --bundles msi,nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FileOrbit-v0.4.0-Windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
