name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - name: Guard exact direct dependency versions
        run: |
          node -e "const p=require('./package.json'); for(const [n,v] of Object.entries({...p.dependencies,...p.devDependencies})) if(/[~^*xX><=| ]/.test(v)) throw new Error(n + ' is not exactly pinned: ' + v)"
      - name: Guard reproducible workflow dependencies
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['.github/workflows/ci.yml','.github/workflows/web-preview.yml','.github/workflows/release-v0.4-rc.yml','.github/workflows/release-v0.4-stable.yml','.github/workflows/release-v0.5-rc.yml']){
            const s=fs.readFileSync(p,'utf8');
            const uses=s.split(/\r?\n/).filter(line=>/^\s*- uses:\s+/.test(line));
            if(uses.some(line=>/@(v\d+|stable)\s*$/.test(line))) throw new Error(p+' contains floating Action ref');
            const runs=s.split(/\r?\n/).filter(line=>/^\s*- run:\s+/.test(line));
            if(runs.some(line=>/npm install --no-audit --no-fund\s*$/.test(line))) throw new Error(p+' regressed from npm ci');
          }
          NODE
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
      - name: Guard Windows GUI subsystem
        run: grep -F 'windows_subsystem = "windows"' src-tauri/src/main.rs
      - name: Guard release version alignment
        run: node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json'); if(p.version!==t.version) throw new Error('package.json and tauri.conf.json versions differ')"
      - name: Guard post-RC2 change boundary
        shell: bash
        run: |
          git fetch --no-tags --deepen=100 origin main
          git fetch --no-tags origin tag v0.5.0-rc.2
          git diff --name-only v0.5.0-rc.2..HEAD > post-rc2-files.txt
          if grep -Ev '^(\.github/|docs/|scripts/|src/styles\.css$|README\.md$)' post-rc2-files.txt > post-rc2-bad.txt; then
            echo "Post-RC2 change outside approved non-runtime boundary:"
            cat post-rc2-bad.txt
            exit 1
          fi
      - name: Guard runtime remains identical to frozen RC2
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin tag v0.5.0-rc.2 || git fetch --tags --force
          for p in package.json package-lock.json vite.config.ts src/App.tsx src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/src/lib.rs src-tauri/src/main.rs; do
            test "$(git rev-parse "v0.5.0-rc.2:$p")" = "$(git rev-parse "HEAD:$p")" || { echo "Runtime drift from frozen RC2: $p"; exit 1; }
          done
      - name: Guard release-control files against unreviewed runtime coupling
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const rc=fs.readFileSync('.github/workflows/release-v0.5-rc.yml','utf8');
          if(!rc.includes('if: false # V0.5 RC3 is frozen after Stable promotion')) throw new Error('RC3 publisher is not frozen');
          const acceptance=fs.readFileSync('docs/V0.5_WINDOWS_ACCEPTANCE.md','utf8');
          if(fs.existsSync('.github/workflows/release-v0.5-stable.yml') && !acceptance.includes('V0.5_STABLE_AUTHORIZED=true')) throw new Error('Stable publisher exists without authorization');
          if(acceptance.includes('V0.5_STABLE_AUTHORIZED=true') && !acceptance.includes('Status: **ACCEPTED**')) throw new Error('Authorization/status mismatch');
          NODE
      - name: Guard V0.5 acceptance evidence
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/V0.5_WINDOWS_ACCEPTANCE.md';
          const s=fs.readFileSync(p,'utf8');
          const authorized=s.includes('V0.5_STABLE_AUTHORIZED=true');
          if(!authorized){
            if(!s.includes('Status: **NOT YET ACCEPTED**')) throw new Error('Blocked acceptance status marker missing');
            if(!s.includes('V0.5_STABLE_AUTHORIZED=false')) throw new Error('Blocked authorization marker missing');
            if(fs.existsSync('.github/workflows/release-v0.5-stable.yml')) throw new Error('Stable publisher must not exist before acceptance');
            process.exit(0);
          }
          if(!s.includes('Status: **ACCEPTED**')) throw new Error('Authorized record must be ACCEPTED');
          for(let i=1;i<=8;i++){
            const row=new RegExp('\\|\\s*'+i+'\\s*\\|[^\\n]*\\|\\s*PASS\\s*\\|');
            if(!row.test(s)) throw new Error('Checkpoint '+i+' is not PASS');
          }
          for(const label of ['Installer type:','Installer SHA-256:','Windows version:','Test start/completion time:','Disposable fixture root:']){
            const line=s.split(/\\r?\\n/).find(x=>x.includes(label));
            if(!line || /TBD\s*$/.test(line)) throw new Error(label+' is incomplete');
          }
          if(!s.includes('6595b54dda289b590b8e7dd564b00c19421b3b56')) throw new Error('Frozen RC3 source identity missing');
          if(!s.includes('727ee4262c7da4f78d6fc074367b2ff9bb65080da9fea2b19d5da384207662f5')) throw new Error('Frozen RC3 EXE digest missing');
          if(!s.includes('b375ea473c7873c98d441077c1d48b44c5c12241467e74d882be5a6bcbcfaba9')) throw new Error('Frozen RC3 MSI digest missing');
          NODE
      - name: Self-test V0.5 acceptance gate rejects incomplete approval
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('docs/V0.5_WINDOWS_ACCEPTANCE.md','utf8');
          const forged=source.replace(/^\| 8 \|.*$/m, line => line.replace('| PASS |','| NOT RUN |'));
          if(!forged.includes('Status: **ACCEPTED**')||!forged.includes('V0.5_STABLE_AUTHORIZED=true')) throw new Error('Acceptance baseline missing');
          let rejected=false;
          try {
            for(let i=1;i<=8;i++){
              const row=new RegExp('\\\\|\\\\s*'+i+'\\\\s*\\\\|[^\\\\n]*\\\\|\\\\s*PASS\\\\s*\\\\|');
              if(!row.test(forged)) throw new Error('Checkpoint '+i+' is not PASS');
            }
          } catch(e) { rejected=true; }
          if(!rejected) throw new Error('Incomplete acceptance unexpectedly passed');
          console.log('Incomplete acceptance correctly rejected.');
          NODE
      - name: Guard frozen V0.5 installed-GUI checkpoint
        run: |
          grep -F 'v0.5.0-rc.2' docs/V0.5_WINDOWS_RUNTIME_CHECKPOINT.md
          grep -F '5171d465137a724a1d76eae1354478b10fc3560f' docs/V0.5_WINDOWS_RUNTIME_CHECKPOINT.md
          grep -F '6c27e0f25382f6ceb673f3c4775fad87e992e2c71d304081682e12800e368e5f' docs/V0.5_WINDOWS_RUNTIME_CHECKPOINT.md
          grep -F '43a9d0d6e125f91333dd88087412720a37588c6ad1b7cf8aa3823e8f460ec780' docs/V0.5_WINDOWS_RUNTIME_CHECKPOINT.md
          grep -F 'V0.5 stable remains **BLOCKED**' docs/V0.5_WINDOWS_RUNTIME_CHECKPOINT.md
      - name: Guard V0.5 RC3 publisher identity
        run: |
          grep -F 'if: false # V0.5 RC3 is frozen after Stable promotion' .github/workflows/release-v0.5-rc.yml
          grep -F 'v0.5.0-rc.3' .github/workflows/release-v0.5-rc.yml
          grep -F 'FileOrbit V0.5 RC3' .github/workflows/release-v0.5-rc.yml
      - name: Guard legacy release triggers against current V0.5 source
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=require('./package.json');
          if(pkg.version.startsWith('0.5.')){
            for(const p of ['.github/workflows/release-v0.4-rc.yml','.github/workflows/release-v0.4-stable.yml']){
              const s=fs.readFileSync(p,'utf8');
              if(!s.includes('if: false')) throw new Error(p+' must be disabled while main is V0.5');
            }
          }
          NODE
      - name: Guard approved Folder Map routing
        run: |
          grep -F 'mapTarget?.sources.length===1?mapTarget.sources[0]' src/App.tsx
          grep -F 'const approvedFolder=' src/App.tsx
          grep -F '승인된 ${role} 폴더가 여러 개라 목적지를 자동 결정하지 않음' src/App.tsx
      - name: Guard desktop asset base and Move gate order
        run: |
          grep -F 'base: process.env.FILEORBIT_WEB_PREVIEW === "1" ? "/fileorbit/" : "./"' vite.config.ts
          grep -F 'disabled={validation.length!==approvedDownloads.length||!approvedDownloads.length||validation.some(v=>!v.ok)}' src/App.tsx
          grep -F '?"승인 파일 이동 실행":"이동 계획 안전검증"' src/App.tsx
      - name: Guard Folder Map persistence and fail-closed restore
        run: |
          grep -F 'const storageKey="fileorbit.folderMap.v02"' src/App.tsx
          grep -F 'localStorage.getItem(storageKey)' src/App.tsx
          grep -F 'setSavedMap(m);setApproved(true)' src/App.tsx
          grep -F 'localStorage.setItem(storageKey,JSON.stringify(m))' src/App.tsx
          grep -F 'if(s.mapRoot===mapRoot&&s.mapApprovedAt===mapApprovedAt&&s.downloadRoot===downloadRoot)setDecisions' src/App.tsx
          grep -F 'if(s.mapRoot===mapRoot&&s.mapApprovedAt===mapApprovedAt&&s.downloadRoot===downloadRoot)setRoleOverrides' src/App.tsx
          grep -F 'setValidation([]);setMoveArmed(false)' src/App.tsx
      - run: npm run build
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: rustc --version && cargo --version
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  windows-uat-fixture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify UAT fixture fail-closed guards
        shell: pwsh
        run: |
          $outside = Join-Path $env:GITHUB_WORKSPACE "FileOrbit-UAT"
          try { ./scripts/new-v05-uat-fixture.ps1 -Root $outside; throw "Outside-TEMP creation unexpectedly succeeded." } catch {
            if ($_.Exception.Message -eq "Outside-TEMP creation unexpectedly succeeded.") { throw }
          }
          $wrong = Join-Path $env:TEMP "Not-FileOrbit-UAT"
          try { ./scripts/new-v05-uat-fixture.ps1 -Root $wrong; throw "Wrong-name creation unexpectedly succeeded." } catch {
            if ($_.Exception.Message -eq "Wrong-name creation unexpectedly succeeded.") { throw }
          }
          $fake = Join-Path $env:TEMP "FileOrbit-UAT"
          New-Item -ItemType Directory -Path $fake -Force | Out-Null
          try { ./scripts/remove-v05-uat-fixture.ps1 -Root $fake; throw "Manifest-less cleanup unexpectedly succeeded." } catch {
            if ($_.Exception.Message -eq "Manifest-less cleanup unexpectedly succeeded.") { throw }
          }
          if (-not (Test-Path $fake)) { throw "Guard test directory was unexpectedly removed." }
          Remove-Item -LiteralPath $fake -Recurse -Force
      - name: Verify RC2 installer verifier fails closed
        shell: pwsh
        run: |
          $fake = Join-Path $env:TEMP "FileOrbit_0.5.0_x64-setup.exe"
          Set-Content -LiteralPath $fake -Value "synthetic-not-an-installer"
          $rejected = $false
          try { ./scripts/verify-v05-rc2-installer.ps1 -InstallerPath $fake } catch { $rejected = $true }
          Remove-Item -LiteralPath $fake -Force
          if (-not $rejected) { throw "Verifier unexpectedly accepted a wrong SHA-256." }
      - name: Create disposable UAT fixture
        shell: pwsh
        run: ./scripts/new-v05-uat-fixture.ps1
      - name: Verify synthetic fixture
        shell: pwsh
        run: |
          $root = Join-Path $env:TEMP "FileOrbit-UAT"
          $m = Get-Content (Join-Path $root "fixture.json") -Raw | ConvertFrom-Json
          if ($m.synthetic_only -ne $true) { throw "Fixture is not marked synthetic." }
          if (-not (Test-Path (Join-Path $root "Downloads/project-note.txt"))) { throw "Synthetic file missing." }
          if (-not (Test-Path (Join-Path $root "Work/Projects"))) { throw "Synthetic Work folder missing." }
      - name: Remove disposable UAT fixture
        shell: pwsh
        run: ./scripts/remove-v05-uat-fixture.ps1
      - name: Verify cleanup
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:TEMP "FileOrbit-UAT")) { throw "Fixture cleanup failed." }
  windows-installer:
    needs: [frontend, rust-check]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-checkpoint]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Run Rust tests on Windows
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles msi,nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FileOrbit-v0.5.0-RC1-Windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
