name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Guard Windows GUI subsystem
        run: grep -F 'windows_subsystem = "windows"' src-tauri/src/main.rs
      - name: Guard release version alignment
        run: node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json'); if(p.version!==t.version) throw new Error('package.json and tauri.conf.json versions differ')"
      - name: Guard approved Folder Map routing
        run: |
          grep -F 'mapTarget?.sources.length===1?mapTarget.sources[0]' src/App.tsx
          grep -F 'approvedFolder?(approvedFolder+"\\\\\\\\"+file.name):null' src/App.tsx
          if grep -F 'savedMap?.root+"\\\\\\\\"+target.target' src/App.tsx; then
            echo "Downloads routing must not synthesize an unapproved role directory"
            exit 1
          fi
      - run: npm run build
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
  windows-installer:
    needs: [frontend, rust-check]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-checkpoint]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - run: npm run tauri build -- --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: FileOrbit-v0.4.0-Windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
