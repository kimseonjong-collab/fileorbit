name: Web Preview Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Upload browser preview build
        uses: actions/upload-artifact@v4
        with:
          name: FileOrbit-Web-Preview
          path: dist
          retention-days: 14
